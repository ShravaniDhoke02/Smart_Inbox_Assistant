spring.datasource.url=jdbc:oracle:thin:@oracle-db:1521/FREEPDB1
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=${JDBC_USER:smartinbox}
spring.datasource.password=${JDBC_PASSWORD:smartinbox}
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

ai.service.url=${AI_SERVICE_URL:http://ai-service:8000/analyze}
mail.imap.enabled=${MAIL_IMAP_ENABLED:false}
security.enabled=${SECURITY_ENABLED:true}
demo.fixture-dir=${DEMO_FIXTURE_DIR:/fixtures}
persistence.single-table-cleanup=${SINGLE_TABLE_CLEANUP:true}
server.port=8080
