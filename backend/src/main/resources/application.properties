spring.application.name=backend

# Database Configuration (Oracle in Docker; H2 remains the local default)
spring.datasource.url=${JDBC_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.driver-class-name=${JDBC_DRIVER:oracle.jdbc.OracleDriver}
spring.datasource.username=${JDBC_USER:smartinbox}
spring.datasource.password=${JDBC_PASSWORD:smartinbox}
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM:org.hibernate.dialect.OracleDialect}
spring.h2.console.enabled=true

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Mail IMAP Configuration
mail.imap.host=imap.gmail.com
mail.imap.port=993
mail.imap.username=dummy@gmail.com
mail.imap.password=dummy
mail.imap.protocol=imaps
mail.imap.folder=INBOX
mail.imap.enabled=false
mail.imap.poll-delay-ms=60000

# AI Service Configuration
ai.service.url=http://localhost:8000/analyze
processing.recovery-delay-ms=30000
demo.fixture-dir=${DEMO_FIXTURE_DIR:}
persistence.single-table-cleanup=${SINGLE_TABLE_CLEANUP:true}

# Optional production access control. Keep false for the local synthetic demo.
security.enabled=false
security.username=${SMART_INBOX_REVIEWER_USERNAME:reviewer}
security.password=${SMART_INBOX_REVIEWER_PASSWORD:change-me}

# Security hardening defaults
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.error.include-stacktrace=never
server.forward-headers-strategy=framework

# Server
server.port=8080
spring.web.resources.static-locations=classpath:/static/
